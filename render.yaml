services:
  - type: web
    name: c-library
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false   # You will paste your MongoDB Atlas URI in Render dashboard
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000