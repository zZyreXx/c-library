<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>C Library — by Taifyu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#1e1e1e; --sidebar:#252526; --panel:#2d2d30; --border:#3e3e42;
      --accent:#007acc; --accent2:#0098ff; --green:#4ec9b0; --yellow:#dcdcaa;
      --orange:#ce9178; --purple:#c586c0; --red:#f44747; --text:#cccccc;
      --text-dim:#858585; --text-br:#ffffff; --tab-bg:#2d2d30; --tab-act:#1e1e1e;
      --scrollbar:#424242;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

    /* TITLEBAR */
    .titlebar{background:#323233;height:30px;display:flex;align-items:center;padding:0 16px;font-size:12px;color:var(--text-dim);border-bottom:1px solid #111;user-select:none;flex-shrink:0;gap:8px;}
    .titlebar .title{flex:1;text-align:center;color:var(--text);}
    .traffic-lights{display:flex;gap:6px;}
    .tl{width:12px;height:12px;border-radius:50%;}
    .tl.red{background:#ff5f56;} .tl.yellow{background:#ffbd2e;} .tl.green{background:#27c93f;}

    /* MENUBAR */
    .menubar{background:#3c3c3c;height:28px;display:flex;align-items:center;padding:0 8px;font-size:12px;gap:4px;border-bottom:1px solid #111;flex-shrink:0;}
    .menubar span{padding:2px 8px;border-radius:3px;cursor:pointer;color:var(--text);}
    .menubar span:hover{background:#505050;}

    /* LAYOUT */
    .layout{display:flex;flex:1;overflow:hidden;}

    /* ACTIVITY BAR */
    .activity-bar{width:48px;background:#333;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;border-right:1px solid #111;flex-shrink:0;}
    .ab-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--text-dim);font-size:18px;transition:color .15s;position:relative;}
    .ab-icon:hover,.ab-icon.active{color:var(--text-br);}
    .ab-icon.active::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:2px;height:24px;background:var(--accent);border-radius:0 2px 2px 0;}

    /* SIDEBAR */
    .sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
    .sidebar-header{padding:12px 16px 8px;font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .sidebar-header button{background:var(--accent);border:none;color:#fff;font-size:10px;padding:3px 10px;border-radius:3px;cursor:pointer;font-family:inherit;font-weight:600;letter-spacing:0;text-transform:none;}
    .sidebar-header button:hover{background:var(--accent2);}

    .search-box{padding:10px 12px;border-bottom:1px solid var(--border);}
    .search-wrap{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:5px 8px;gap:6px;}
    .search-wrap:focus-within{border-color:var(--accent);}
    .search-wrap input{background:none;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;width:100%;}
    .search-wrap input::placeholder{color:var(--text-dim);}

    .filter-bar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .cat-chip{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--panel);color:var(--text-dim);cursor:pointer;border:1px solid transparent;transition:all .15s;font-family:'JetBrains Mono',monospace;}
    .cat-chip:hover{color:var(--text);border-color:var(--border);}
    .cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

    .file-list{flex:1;overflow-y:auto;padding:4px 0;}
    .file-list::-webkit-scrollbar{width:6px;}
    .file-list::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px;}
    .file-item{display:flex;align-items:center;gap:8px;padding:5px 16px;cursor:pointer;font-size:13px;color:var(--text);transition:background .1s;border-left:2px solid transparent;}
    .file-item:hover{background:#2a2d2e;}
    .file-item.active{background:#37373d;border-left-color:var(--accent);}
    .file-icon{font-size:13px;flex-shrink:0;}
    .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-family:'JetBrains Mono',monospace;}
    .file-badge{font-size:9px;padding:1px 5px;border-radius:8px;background:var(--panel);color:var(--text-dim);flex-shrink:0;}
    .file-list-empty{padding:24px 16px;text-align:center;color:var(--text-dim);font-size:12px;line-height:1.7;}

    .made-by-side{padding:10px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--text-dim);text-align:center;}
    .made-by-side span{color:var(--accent);font-family:'JetBrains Mono',monospace;}

    /* MAIN */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .tabs{display:flex;background:var(--tab-bg);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
    .tabs::-webkit-scrollbar{height:2px;}
    .tab{display:flex;align-items:center;gap:6px;padding:0 16px;height:35px;font-size:12px;cursor:pointer;border-right:1px solid var(--border);color:var(--text-dim);background:var(--tab-bg);white-space:nowrap;transition:all .1s;}
    .tab:hover{color:var(--text);background:#2a2a2b;}
    .tab.active{background:var(--tab-act);color:var(--text-br);border-top:1px solid var(--accent);}
    .tab-icon{font-size:12px;}

    .content{flex:1;overflow-y:auto;}
    .content::-webkit-scrollbar{width:8px;}
    .content::-webkit-scrollbar-track{background:var(--bg);}
    .content::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px;}

    /* WELCOME */
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:40px;text-align:center;}
    .welcome-logo{font-family:'JetBrains Mono',monospace;font-size:72px;font-weight:600;color:var(--accent);line-height:1;text-shadow:0 0 60px rgba(0,122,204,.4);}
    .welcome h1{font-size:26px;font-weight:300;color:var(--text-br);}
    .welcome p{color:var(--text-dim);font-size:13px;max-width:380px;line-height:1.7;}
    .welcome-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
    .btn{padding:8px 20px;border-radius:4px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:all .15s;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{background:var(--accent2);}
    .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
    .btn-ghost:hover{background:var(--panel);}
    .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
    .btn-danger:hover{background:rgba(244,71,71,.1);}
    .welcome-stats{display:flex;gap:40px;margin-top:8px;}
    .stat{text-align:center;}
    .stat-num{font-size:30px;font-weight:600;color:var(--green);font-family:'JetBrains Mono',monospace;}
    .stat-label{font-size:11px;color:var(--text-dim);margin-top:2px;}

    /* CODE VIEW */
    .code-view{padding:28px 36px;}
    .breadcrumb{font-size:12px;color:var(--text-dim);margin-bottom:16px;display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;}
    .breadcrumb .sep{color:var(--border);}
    .breadcrumb .cur{color:var(--text);}
    .code-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;}
    .code-meta h2{font-size:20px;color:var(--text-br);font-weight:500;}
    .code-desc{font-size:13px;color:var(--text-dim);margin-top:6px;line-height:1.6;}
    .code-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
    .tag{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(0,122,204,.15);color:var(--accent2);border:1px solid rgba(0,122,204,.3);font-family:'JetBrains Mono',monospace;}
    .meta-row{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap;}
    .meta-item{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
    .meta-item .val{color:var(--text);}
    .code-actions{display:flex;gap:8px;flex-shrink:0;}

    .code-block-wrap{border-radius:6px;border:1px solid var(--border);overflow:hidden;}
    .code-block-bar{display:flex;align-items:center;justify-content:space-between;background:#252526;padding:7px 16px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border);}
    .code-block-bar .lang{color:var(--green);font-family:'JetBrains Mono',monospace;}
    .copy-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);color:var(--text-dim);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s;}
    .copy-btn:hover{border-color:var(--accent);color:var(--text);}
    .copy-btn.copied{border-color:var(--green);color:var(--green);}

    .line-numbers{display:flex;background:var(--bg);}
    .ln-nums{padding:20px 12px 20px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;color:var(--text-dim);text-align:right;user-select:none;border-right:1px solid var(--border);min-width:48px;}
    pre{background:var(--bg);padding:20px 20px 20px 16px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;tab-size:4;flex:1;}
    pre::-webkit-scrollbar{height:6px;}
    pre::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px;}

    /* syntax */
    .kw{color:#569cd6;} .ty{color:#4ec9b0;} .fn{color:#dcdcaa;}
    .cm{color:#6a9955;font-style:italic;} .st{color:#ce9178;}
    .nm{color:#b5cea8;} .pp{color:#c586c0;} .op{color:#d4d4d4;}

    /* UPLOAD */
    .upload-view{padding:28px 36px;max-width:780px;}
    .upload-view h2{font-size:18px;color:var(--text-br);font-weight:500;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px;}
    .req{color:var(--accent);}
    .form-input,.form-select,.form-textarea{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:4px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .15s;}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
    .form-select option{background:var(--panel);}
    .form-textarea{font-family:'JetBrains Mono',monospace;font-size:12px;min-height:300px;resize:vertical;line-height:1.7;}
    .form-row{display:flex;gap:16px;}
    .form-row .form-group{flex:1;}
    .form-hint{font-size:11px;color:var(--text-dim);margin-top:4px;}
    .upload-actions{display:flex;gap:12px;margin-top:8px;}

    /* STATUS BAR */
    .statusbar{background:var(--accent);height:22px;display:flex;align-items:center;padding:0 14px;font-size:11px;gap:14px;color:#fff;flex-shrink:0;}
    .statusbar .right{margin-left:auto;display:flex;gap:14px;}
    .statusbar a{color:rgba(255,255,255,.8);text-decoration:none;}

    /* TOAST */
    .toast{position:fixed;bottom:32px;right:24px;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--green);color:var(--text);padding:10px 16px;border-radius:4px;font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.error{border-left-color:var(--red);}

    /* LOADING */
    .loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-dim);font-size:13px;gap:10px;}
    .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* DELETE CONFIRM */
    .del-bar{background:#2a1a1a;border:1px solid #5a2020;border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-top:16px;}
    .del-bar p{font-size:12px;color:#f4a0a0;flex:1;}
  </style>
</head>
<body>

<div class="titlebar">
  <div class="traffic-lights"><div class="tl red"></div><div class="tl yellow"></div><div class="tl green"></div></div>
  <div class="title">C Library — Visual Studio Code</div>
</div>
<div class="menubar">
  <span onclick="showUpload()">File</span>
  <span>Edit</span>
  <span>View</span>
  <span onclick="showUpload()">Upload</span>
  <span>Help</span>
</div>

<div class="layout">

  <!-- Activity Bar -->
  <div class="activity-bar">
    <div class="ab-icon active" id="ab-explorer" onclick="setActivity('explorer')" title="Explorer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a2 2 0 012-2h3l2 2h9a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    </div>
    <div class="ab-icon" id="ab-search" onclick="setActivity('search')" title="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
    <div class="ab-icon" id="ab-upload" onclick="showUpload()" title="Upload Code">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>C Library</span>
      <button onclick="showUpload()">+ Upload</button>
    </div>

    <div class="search-box">
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search programs..." oninput="handleSearch(this.value)"/>
      </div>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <div class="file-list" id="fileList">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>

    <div class="made-by-side">Made by <span>Taifyu</span> · C Library</div>
  </div>

  <!-- Main Editor -->
  <div class="main">
    <div class="tabs" id="tabs">
      <div class="tab active" id="tab-welcome">
        <span class="tab-icon">🏠</span> Welcome
      </div>
    </div>
    <div class="content" id="content">
      <!-- Welcome shown on load -->
    </div>
  </div>
</div>

<!-- Status Bar -->
<div class="statusbar">
  <span>⎇ main</span>
  <span id="statusCount">0 programs</span>
  <div class="right">
    <span>C Language</span>
    <span>UTF-8</span>
    <a href="#" onclick="showUpload()">Upload Code</a>
    <span>Made by Taifyu</span>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = '/api/programs';
  const CATS = ['All','General','Sorting','Searching','Data Structures','Math','Strings','File I/O','Pointers','Recursion','Other'];
  let programs = [];
  let activeId = null;
  let searchTimer = null;
  let currentCategory = 'All';
  let currentSearch = '';
  let _currentCode = ''; // stores code safely for copy — no inline escaping

  // ── INIT ──
  async function init() {
    renderCategories();
    await loadPrograms();
    showWelcome();
  }

  function renderCategories() {
    const bar = document.getElementById('filterBar');
    bar.innerHTML = CATS.map(c =>
      `<div class="cat-chip ${c==='All'?'active':''}" onclick="filterCat('${c}')">${c}</div>`
    ).join('');
  }

  function filterCat(cat) {
    currentCategory = cat;
    document.querySelectorAll('.cat-chip').forEach(el => {
      el.classList.toggle('active', el.textContent === cat);
    });
    loadPrograms();
  }

  function handleSearch(val) {
    clearTimeout(searchTimer);
    currentSearch = val;
    searchTimer = setTimeout(() => loadPrograms(), 300);
  }

  async function loadPrograms() {
    const list = document.getElementById('fileList');
    let url = API + '?';
    if (currentSearch) url += 'search=' + encodeURIComponent(currentSearch) + '&';
    if (currentCategory !== 'All') url += 'category=' + encodeURIComponent(currentCategory) + '&';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Server error ' + res.status);
      const data = await res.json();
      programs = data.data || [];
      document.getElementById('statusCount').textContent = programs.length + ' program' + (programs.length !== 1 ? 's' : '');
      renderFileList();
    } catch(e) {
      list.innerHTML = '<div class="file-list-empty">⚠️ Cannot connect to server.<br>Check your MONGODB_URI env var on Vercel.</div>';
    }
  }

  function renderFileList() {
    const list = document.getElementById('fileList');
    if (!programs.length) {
      list.innerHTML = '<div class="file-list-empty">No programs found.<br>Be the first to upload!</div>';
      return;
    }
    list.innerHTML = programs.map(p =>
      '<div class="file-item ' + (p._id === activeId ? 'active' : '') + '" onclick="openProgram('' + p._id + '')">' +
      '<span class="file-icon">📄</span>' +
      '<span class="file-name">' + esc(p.title) + '.c</span>' +
      '<span class="file-badge">' + esc(p.category) + '</span>' +
      '</div>'
    ).join('');
  }

  // ── WELCOME ──
  function showWelcome() {
    activeId = null;
    renderFileList();
    setTab('welcome', '🏠 Welcome', false);
    document.getElementById('content').innerHTML =
      '<div class="welcome">' +
      '<div class="welcome-logo">&lt;C&gt;</div>' +
      '<h1>C Program Library</h1>' +
      '<p>A shared space for C programs. Upload, explore, and copy code written by the community.</p>' +
      '<div class="welcome-btns">' +
      '<button class="btn btn-primary" onclick="showUpload()">⬆ Upload a Program</button>' +
      '<button class="btn btn-ghost" onclick="openFirstProgram()">Browse Library</button>' +
      '</div>' +
      '<div class="welcome-stats">' +
      '<div class="stat"><div class="stat-num">' + programs.length + '</div><div class="stat-label">Programs</div></div>' +
      '<div class="stat"><div class="stat-num">' + (CATS.length - 1) + '</div><div class="stat-label">Categories</div></div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">Made by <span style="color:var(--accent);font-family:'JetBrains Mono',monospace;">Taifyu</span></div>' +
      '</div>';
  }

  function openFirstProgram() {
    if (programs.length) openProgram(programs[0]._id);
  }

  // ── OPEN PROGRAM ──
  async function openProgram(id) {
    activeId = id;
    renderFileList();
    const prog = programs.find(p => p._id === id);
    if (prog) setTab(id, prog.title + '.c', false);
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';
    try {
      const res = await fetch(API + '/' + id);
      if (!res.ok) throw new Error('Server error ' + res.status);
      const data = await res.json();
      renderCodeView(data.data);
    } catch(e) {
      document.getElementById('content').innerHTML = '<div class="loading">Failed to load program: ' + e.message + '</div>';
    }
  }

  function renderCodeView(p) {
    _currentCode = p.code; // store safely — copy button reads this, no inline escaping
    const lines = p.code.split('\n');
    const nums = lines.map(function(_,i){ return i+1; }).join('\n');
    const highlighted = syntaxHighlight(esc(p.code));
    const date = new Date(p.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
    const tagsHtml = (p.tags && p.tags.length)
      ? '<div class="code-tags">' + p.tags.map(function(t){ return '<span class="tag">#' + esc(t) + '</span>'; }).join('') + '</div>'
      : '';

    const el = document.getElementById('content');
    el.innerHTML = '';

    const wrap = document.createElement('div');
    wrap.className = 'code-view';
    wrap.innerHTML =
      '<div class="breadcrumb"><span>C Library</span><span class="sep">›</span><span>' + esc(p.category) + '</span><span class="sep">›</span><span class="cur">' + esc(p.title) + '.c</span></div>' +
      '<div class="code-header">' +
        '<div class="code-meta">' +
          '<h2>' + esc(p.title) + '</h2>' +
          (p.description ? '<div class="code-desc">' + esc(p.description) + '</div>' : '') +
          '<div class="meta-row">' +
            '<div class="meta-item">👤 <span class="val">' + esc(p.author || 'Anonymous') + '</span></div>' +
            '<div class="meta-item">🗂 <span class="val">' + esc(p.category) + '</span></div>' +
            '<div class="meta-item">👁 <span class="val">' + p.views + ' views</span></div>' +
            '<div class="meta-item">📅 <span class="val">' + date + '</span></div>' +
            '<div class="meta-item">📏 <span class="val">' + lines.length + ' lines</span></div>' +
          '</div>' +
          tagsHtml +
        '</div>' +
        '<div class="code-actions">' +
          '<button class="btn btn-ghost" id="deleteBtn">🗑 Delete</button>' +
        '</div>' +
      '</div>' +
      '<div class="code-block-wrap">' +
        '<div class="code-block-bar">' +
          '<span class="lang">C Language</span>' +
          '<button class="copy-btn" id="copyBtn">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>' +
            ' Copy' +
          '</button>' +
        '</div>' +
        '<div class="line-numbers">' +
          '<pre class="ln-nums">' + nums + '</pre>' +
          '<pre><code>' + highlighted + '</code></pre>' +
        '</div>' +
      '</div>';

    el.appendChild(wrap);

    // Attach events via JS — no inline onclick with code values
    document.getElementById('copyBtn').addEventListener('click', copyCode);
    document.getElementById('deleteBtn').addEventListener('click', function() {
      confirmDelete(p._id, p.title);
    });
  }

  // ── UPLOAD ──
  function showUpload() {
    activeId = null;
    renderFileList();
    setTab('upload', '⬆ Upload.c', true);
    document.getElementById('content').innerHTML =
      '<div class="upload-view">' +
      '<h2>⬆ Upload C Program</h2>' +
      '<div class="form-row">' +
        '<div class="form-group"><label>Title <span class="req">*</span></label><input class="form-input" id="fTitle" placeholder="e.g. Bubble Sort" /></div>' +
        '<div class="form-group"><label>Category</label><select class="form-select" id="fCat">' +
          CATS.filter(function(c){ return c !== 'All'; }).map(function(c){ return '<option>' + c + '</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
      '<div class="form-group"><label>Description</label><input class="form-input" id="fDesc" placeholder="Brief description..." /></div>' +
      '<div class="form-row">' +
        '<div class="form-group"><label>Your Name</label><input class="form-input" id="fAuthor" placeholder="Anonymous" /></div>' +
        '<div class="form-group"><label>Tags</label><input class="form-input" id="fTags" placeholder="array, loop, pointer" /><div class="form-hint">Comma separated</div></div>' +
      '</div>' +
      '<div class="form-group"><label>C Code <span class="req">*</span></label>' +
        '<textarea class="form-textarea" id="fCode" placeholder="#include &lt;stdio.h&gt;&#10;&#10;int main() {&#10;    // Your code here&#10;    return 0;&#10;}"></textarea>' +
      '</div>' +
      '<div class="upload-actions">' +
        '<button class="btn btn-primary" id="uploadBtn">⬆ Upload Program</button>' +
        '<button class="btn btn-ghost" onclick="showWelcome()">Cancel</button>' +
      '</div>' +
      '</div>';

    document.getElementById('uploadBtn').addEventListener('click', submitUpload);
  }

  async function submitUpload() {
    const title = document.getElementById('fTitle').value.trim();
    const code  = document.getElementById('fCode').value.trim();
    if (!title) { showToast('Title is required', true); return; }
    if (!code)  { showToast('Code is required', true); return; }

    const btn = document.getElementById('uploadBtn');
    btn.textContent = 'Uploading...';
    btn.disabled = true;

    const body = {
      title:       title,
      description: document.getElementById('fDesc').value.trim(),
      code:        code,
      category:    document.getElementById('fCat').value,
      author:      document.getElementById('fAuthor').value.trim() || 'Anonymous',
      tags:        document.getElementById('fTags').value
    };

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const text = await res.text(); // read as text first to catch non-JSON errors
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Server returned invalid response: ' + text.slice(0,100)); }
      if (!data.success) throw new Error(data.error || 'Upload failed');
      showToast('✅ Program uploaded!');
      await loadPrograms();
      openProgram(data.data._id);
    } catch(e) {
      showToast('Upload failed: ' + e.message, true);
      btn.textContent = '⬆ Upload Program';
      btn.disabled = false;
    }
  }

  // ── DELETE ──
  function confirmDelete(id, title) {
    const existing = document.getElementById('delBar');
    if (existing) { existing.remove(); return; }
    const bar = document.createElement('div');
    bar.id = 'delBar';
    bar.className = 'del-bar';
    bar.innerHTML = '<p>⚠️ Delete "<strong>' + esc(title) + '</strong>"? This cannot be undone.</p>';
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', function() { doDelete(id); });
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', function() { bar.remove(); });
    bar.appendChild(delBtn);
    bar.appendChild(cancelBtn);
    document.querySelector('.code-view').appendChild(bar);
  }

  async function doDelete(id) {
    try {
      const res = await fetch(API + '/' + id, { method: 'DELETE' });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Server error'); }
      if (!data.success) throw new Error(data.error);
      showToast('🗑 Program deleted');
      await loadPrograms();
      showWelcome();
    } catch(e) {
      showToast('Delete failed: ' + e.message, true);
    }
  }

  // ── TABS ──
  function setTab(id, label, modified) {
    const tabs = document.getElementById('tabs');
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    const existing = document.getElementById('tab-' + id);
    if (existing) { existing.classList.add('active'); return; }
    const allTabs = tabs.querySelectorAll('.tab:not(#tab-welcome)');
    if (allTabs.length > 4) allTabs[0].remove();
    const tab = document.createElement('div');
    tab.className = 'tab active' + (modified ? ' modified' : '');
    tab.id = 'tab-' + id;
    tab.innerHTML = '<span class="tab-icon">📄</span> ' + esc(label);
    tab.addEventListener('click', function() {
      if (id === 'upload') showUpload();
      else if (id === 'welcome') showWelcome();
      else openProgram(id);
    });
    tabs.appendChild(tab);
  }

  function setActivity(name) {
    document.querySelectorAll('.ab-icon').forEach(function(el) { el.classList.remove('active'); });
    var el = document.getElementById('ab-' + name);
    if (el) el.classList.add('active');
  }

  // ── COPY — reads _currentCode, no args needed ──
  function copyCode() {
    navigator.clipboard.writeText(_currentCode).then(function() {
      const btn = document.getElementById('copyBtn');
      if (!btn) return;
      btn.classList.add('copied');
      btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
      showToast('✅ Code copied to clipboard!');
      setTimeout(function() {
        btn.classList.remove('copied');
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy';
      }, 2000);
    }).catch(function() {
      showToast('Copy failed — try selecting manually', true);
    });
  }

  // ── TOAST ──
  function showToast(msg, error) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (error ? ' error' : '');
    setTimeout(function() { t.className = 'toast'; }, 3000);
  }

  // ── SYNTAX HIGHLIGHT ──
  function syntaxHighlight(code) {
    return code
      .replace(/(\/\/[^\n]*)/g, '<span class="cm">$1</span>')
      .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>')
      .replace(/(&lt;[^&]+&gt;)/g, '<span class="st">$1</span>')
      .replace(/"([^"]*)"/g, '<span class="st">"$1"</span>')
      .replace(/#(include|define|ifndef|ifdef|endif|pragma|undef|if|else|elif)\b/g, '<span class="pp">#$1</span>')
      .replace(/\b(int|char|float|double|void|long|short|unsigned|signed|const|static|extern|struct|union|enum|typedef|return|if|else|for|while|do|switch|case|break|continue|default|sizeof|goto|register|volatile|auto|inline)\b/g, '<span class="kw">$1</span>')
      .replace(/\b([A-Z_][A-Z0-9_]{2,})\b/g, '<span class="ty">$1</span>')
      .replace(/\b([a-zA-Z_]\w*)\s*(?=\()/g, '<span class="fn">$1</span>')
      .replace(/\b(\d+\.?\d*[fFuUlL]*)\b/g, '<span class="nm">$1</span>');
  }

  // ── UTILS ──
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
